# Default configuration for PolicyEngine Household API
# This configuration provides defaults suitable for local development

---
# Application settings
app:
  name: policyengine-household-api # Can be any value
  environment: local # Can be any value; not used for any purpose at the moment
  debug: false  # Set to true for development mode (if analytics are enabled, 
  # stores analytics output in local SQLite database)

# Request rate limiting configuration
rate_limit:
  # Whether configured request limits are enforced
  enabled: true

# User analytics configuration
# Controls whether user analytics are collected and stored
analytics:
  # Whether analytics collection is enabled (opt-in)
  enabled: false  # Set to true to enable analytics collection

  # Whether to collect privacy-safe calculate variable usage metadata
  # when analytics are enabled. Request/response bodies, values, entity IDs,
  # and household membership relationships are not stored.
  collect_variable_usage: true

  # Cloud Tasks producer configuration for calculate analytics writes.
  cloud_tasks:
    project: ""
    location: ""
    queue: ""
    target_url: ""
    service_account_email: ""
    oidc_audience: ""
    dispatch_deadline_seconds: 300
  
  # Database connection for analytics (only used if enabled=true)
  # These will be overridden by environment variables in production
  database:
    # Optional full SQLAlchemy URL, primarily for local migration testing
    url: ""  # Override with ANALYTICS_DATABASE_URL
    # Connection name for Google Cloud SQL
    connection_name: ""  # Override with USER_ANALYTICS_DB_CONNECTION_NAME
    # Database username
    username: ""  # Override with USER_ANALYTICS_DB_USERNAME  
    # Database password
    password: ""  # Override with USER_ANALYTICS_DB_PASSWORD

# Authentication configuration
# Controls whether Auth0 authentication is enforced on API endpoints
auth:
  # Whether authentication is enabled (opt-in)
  enabled: false  # Set to true to enable Auth0 authentication
  
  # Auth0 configuration (only used if enabled=true)
  # These will be overridden by environment variables in production
  auth0:
    # Auth0 domain (without https:// or trailing slash)
    address: ""  # Override with AUTH0_ADDRESS_NO_DOMAIN
    # Auth0 API audience
    audience: ""  # Override with AUTH0_AUDIENCE_NO_DOMAIN
    # Test JWT token used only for GitHub Actions tests pre-deployment
    test_token: "" # Override with AUTH0_TEST_TOKEN_NO_DOMAIN
    # Space-delimited OAuth scopes for the static test token
    test_token_scopes: "" # Override with AUTH0_TEST_TOKEN_SCOPES

# Door 1: Axiom rules under this API through policyengine-axiom.
# Off by default; see docs/axiom-door1-design.md. Only a Modal worker image
# built with HOUSEHOLD_AXIOM_DOOR1_PACKAGES installs policyengine-axiom and
# turns this on. Values are read once, inside the worker's memory snapshot.
axiom_door1:
  enabled: false  # Override with AXIOM_DOOR1__ENABLED
  # Bind-time mode: shadow (PE answers, Axiom compared), compare (Axiom
  # answers where the provider certifies it, PE still runs and is compared),
  # or on (Axiom answers, no comparison). strict is refused.
  mode: shadow  # Override with AXIOM_DOOR1__MODE
  # Requests whose gateway-resolved channel is listed may get Axiom answers;
  # every other request runs with the provider capped to off.
  serve_channels: [frontier]  # Override with AXIOM_DOOR1__SERVE_CHANNELS
  # Optional allowlist of client ids (token `sub` without "@clients");
  # empty means every client on a serve channel.
  clients: []  # Override with AXIOM_DOOR1__CLIENTS (comma-separated)
  # Requests on these channels that the serving rule above does not select
  # run in shadow: PolicyEngine answers and Axiom is only compared. Empty
  # sends them to PolicyEngine with the provider off.
  shadow_channels: []  # Override with AXIOM_DOOR1__SHADOW_CHANNELS
  countries: [us]
  # RuleSpec corpus root; empty uses PE_AXIOM_CORPUS_ROOT.
  corpus_root: ""
