[project]
name = "policyengine-household-modal-api"
version = "0.32.0"
description = "Modal worker and canary apps for the PolicyEngine Household API"
readme = "README.md"
authors = [
    { name = "PolicyEngine", email = "hello@policyengine.org" },
]
requires-python = ">=3.12"
classifiers = ["Private :: Do Not Upload"]
# The base closure supports the release CLIs and canary. The worker image
# installs the `worker` extra, pulling the core application and transitively
# the analytics stack used by worker revision checks.
dependencies = [
    "policyengine-household-common==0.32.0",
    "modal>=1.3.0",
    "policyengine-observability[flask,google]>=1.4.0,<2",
]

[project.optional-dependencies]
worker = [
    "policyengine-household-api==0.32.0",
    "policyengine-household-analytics==0.32.0",
]

[tool.uv.sources]
policyengine-household-common = { workspace = true }
policyengine-household-api = { workspace = true }
policyengine-household-analytics = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["policyengine_household_modal"]
