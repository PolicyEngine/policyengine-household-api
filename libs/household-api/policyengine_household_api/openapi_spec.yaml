openapi: 3.0.0
info:
  title: PolicyEngine Household API
  description: The PolicyEngine Household API calculates policy outcomes for household JSON payloads without storing household data.
  version: PACKAGE_VERSION
  contact:
    name: PolicyEngine Support
    email: hello@policyengine.org
    url: https://policyengine.org
servers:
  - url: https://household.api.policyengine.org
    description: Hosted household API
  - url: http://localhost:8080
    description: Local Docker household API
paths:
  /:
    get:
      summary: Get service metadata for the PolicyEngine household API
      operationId: get_home
      description: Returns service metadata, documentation links, and self-hosting hints.
      responses:
        "200":
          description: Service metadata.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  result:
                    type: object
                    properties:
                      docs_url:
                        type: string
                      container_image:
                        type: string
                      openapi_spec_url:
                        type: string
                      hosted_calculate_url_template:
                        type: string
                      local_calculate_url_template:
                        type: string
                      health_checks:
                        type: object
                        properties:
                          liveness:
                            type: string
                          readiness:
                            type: string

  /{country_id}/calculate:
    post:
      summary: Calculate household and policy without storing data
      operationId: get_calculate
      description: Lightweight endpoint for passing in household JSON objects and calculating without storing data. Specify the country ID.
      security:
        - bearerAuth: []
      parameters:
        - name: country_id
          in: path
          description: The country ID.
          required: true
          schema:
            type: string
            enum:
              - uk
              - us
              - ca
              - ng
              - il
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalculateRequest"
            examples:
              us_single_adult:
                summary: US single adult
                value:
                  household:
                    people:
                      you:
                        age:
                          "2025": 30
                        employment_income:
                          "2025": 50000
                    households:
                      your household:
                        members:
                          - you
                        state_name:
                          "2025": CA
                    families:
                      your family:
                        members:
                          - you
                    tax_units:
                      your tax unit:
                        members:
                          - you
                    marital_units:
                      your marital unit:
                        members:
                          - you
                    spm_units:
                      your spm unit:
                        members:
                          - you
              uk_single_adult:
                summary: UK single adult
                value:
                  household:
                    people:
                      person:
                        age:
                          "2025": 30
                        employment_income:
                          "2025": 30000
                    benunits:
                      benunit:
                        members:
                          - person
                    households:
                      household:
                        members:
                          - person
      responses:
        "200":
          description: The calculation result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalculateSuccessResponse"
              examples:
                success:
                  summary: Successful calculation
                  value:
                    status: ok
                    message: null
                    result:
                      people:
                        you:
                          age:
                            "2025": 30
                          employment_income:
                            "2025": 50000
                      households:
                        your household:
                          household_net_income:
                            "2025": 46375.0
                    policyengine_bundle:
                      model_version: 1.687.0
                      data_version: null
                      dataset: null
        "400":
          description: Invalid request payload or unsupported household variable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              examples:
                unknown_variable:
                  summary: Variable not available
                  value:
                    status: error
                    message: Invalid household variables.
                    errors:
                      - Variable `not_a_variable` on `people/you` is not available in PolicyEngine model version 1.687.0 used by this API. Remove it or migrate to a supported variable.
                invalid_payload:
                  summary: Invalid household payload
                  value:
                    status: error
                    message: "'household' must be a JSON object"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "403":
          description: The bearer token is valid but not authorized for this API.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "422":
          description: The requested exact package version is not active.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionRoutingErrorResponse"
              examples:
                unsupported_version:
                  summary: Exact package version is not active
                  value:
                    status: error
                    code: unsupported_version
                    message: "No active household API app serves `us` package version `9.9.9`"
                    requested_version: "9.9.9"
                    country_id: us
                    available_versions:
                      current: "1.0.0"
                      frontier: "2.0.0"
        "500":
          description: Error calculating household under policy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: Invalid country ID.
          content:
            text/html:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
  /analytics/calculate/requests:
    get:
      summary: Get calculate request variable analytics
      operationId: get_calculate_analytics_requests
      description: Returns value-free analytics records for inbound calculate requests. Requires a bearer token with the read:calculate-analytics scope. Each record includes request metadata, grouped variable keys when that metadata was collected, provenance, and the opaque caller client_id, but not household values, household entity IDs, request bodies, or response bodies. Records recovered from the legacy visits table identify unavailable metadata with null values and variable_metadata_collected=false.
      security:
        - bearerAuth: []
      parameters:
        - name: start_time
          in: query
          description: "Optional inclusive ISO 8601 lower bound for request creation time. Alias: start."
          required: false
          schema:
            type: string
            format: date-time
        - name: end_time
          in: query
          description: "Optional inclusive ISO 8601 upper bound for request creation time. Alias: end."
          required: false
          schema:
            type: string
            format: date-time
        - name: requested_version
          in: query
          description: Optional filter for the Modal request version selector, such as current, frontier, or an exact package version.
          required: false
          schema:
            type: string
        - name: resolved_channel
          in: query
          description: Optional filter for the Modal channel that served the request.
          required: false
          schema:
            $ref: "#/components/schemas/CalculateAnalyticsResolvedChannel"
        - name: client_id
          in: query
          description: Optional filter for the opaque caller identifier stored on each record. Matches exactly; the value may be an Auth0 machine-to-machine client_id or an interactive-user subject. Unknown values return an empty result.
          required: false
          schema:
            type: string
        - name: unique
          in: query
          description: When true, return one row per unique variable key instead of one row per calculate request. Summaries cover only requests where variable_metadata_collected is true; variable usage cannot be reconstructed for legacy visits.
          required: false
          schema:
            type: boolean
            default: false
        - name: limit
          in: query
          description: Maximum number of request records returned when unique is false.
          required: false
          schema:
            type: integer
            default: 1000
            minimum: 1
            maximum: 10000
      responses:
        "200":
          description: Calculate request analytics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalculateAnalyticsResponse"
              examples:
                request_records:
                  summary: Request records
                  value:
                    status: ok
                    message: null
                    start_time: "2026-05-07T00:00:00Z"
                    end_time: "2026-05-13T00:00:00Z"
                    requested_version: null
                    resolved_channel: null
                    client_id: null
                    unique: false
                    requests:
                      - request_uuid: "018f79e7-6ee3-7621-9eda-6d29cf0cf910"
                        created_at: "2026-05-10T12:00:00Z"
                        client_id: "M5laaMnHNbCeZ9azRLdPDFOGLbysRIKR"
                        api_version: "0.17.0"
                        country_id: us
                        model_version: "1.691.1"
                        requested_version: frontier
                        resolved_channel: frontier
                        endpoint: calculate
                        method: POST
                        response_status_code: 200
                        distinct_variable_count: 2
                        unsupported_variable_count: 0
                        deprecated_allowlisted_variable_count: 0
                        record_source: live
                        variable_metadata_collected: true
                        variables:
                          - variable_name: employment_income
                            entity_type: person
                            source: household_input
                            period_granularity: year
                            entity_count: 1
                            period_count: 1
                            occurrence_count: 1
                            availability_status: supported
                            variable_name_truncated: false
                unique_keys:
                  summary: Unique variable keys
                  value:
                    status: ok
                    message: null
                    start_time: null
                    end_time: null
                    requested_version: null
                    resolved_channel: null
                    client_id: null
                    unique: true
                    unique_keys:
                      - variable_name: age
                        entity_type: person
                        source: household_input
                        period_granularity: year
                        availability_status: supported
                        variable_name_truncated: false
                        request_count: 12
                        occurrence_count: 18
                        first_seen: "2026-05-01T00:00:00Z"
                        last_seen: "2026-05-13T00:00:00Z"
        "400":
          description: Invalid analytics query parameter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "403":
          description: The bearer token is valid but does not include the read:calculate-analytics scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "503":
          description: Analytics storage is disabled or not ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"

  /liveness_check:
    get:
      summary: Test for server liveness.
      operationId: liveness_check
      description: Determine whether or not the PolicyEngine server is live.
      responses:
        "200":
          description: Server is live.
          content:
            text/plain:
              schema:
                type: string
  /readiness_check:
    get:
      summary: Test for server readiness.
      operationId: readiness_check
      description: Determine whether or not the PolicyEngine server is ready.
      responses:
        "200":
          description: Server is ready.
          content:
            text/plain:
              schema:
                type: string
  /specification:
    get:
      summary: Get OpenAPI specs.
      operationId: get_specification
      description: Get OpenAPI-formatted specs of PolicyEngine API
      responses:
        "200":
          description: OpenAPI specs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  info:
                    type: object
                  openapi:
                    type: string
                  paths:
                    type: object
                  servers:
                    type: array
                  components:
                    type: object
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Hosted API requests require an Auth0 bearer token. Local Docker requests usually run without authentication. Analytics endpoints may require additional OAuth scopes.
  schemas:
    CalculateRequest:
      type: object
      required:
        - household
      properties:
        household:
          $ref: "#/components/schemas/Household"
        policy:
          type: object
          description: >-
            Optional policy reform object mapping parameter paths to
            period-keyed values, e.g.
            {"gov.hmrc.income_tax.allowances.personal_allowance.amount":
            {"2026-01-01.2026-12-31": 15000}}. Each period key must be two
            dot-separated instants (start.stop). Values are cast to the
            parameter's type; boolean parameters accept true/false,
            "true"/"false", "1"/"0", or the numbers 0/1. Malformed period
            keys or values return a 500 with a descriptive message.
          additionalProperties: true
        version:
          type: string
          description: Optional API version selector. Omit this field to use the current release, pass current or frontier to select an active release channel, or pass an exact active country package version.
      additionalProperties: false
    Household:
      type: object
      description: A household is a map of entity groups. Each entity group maps entity IDs to variables. Each variable maps periods to values.
      required:
        - people
      properties:
        people:
          $ref: "#/components/schemas/EntityGroup"
        households:
          $ref: "#/components/schemas/EntityGroup"
        families:
          $ref: "#/components/schemas/EntityGroup"
        tax_units:
          $ref: "#/components/schemas/EntityGroup"
        marital_units:
          $ref: "#/components/schemas/EntityGroup"
        spm_units:
          $ref: "#/components/schemas/EntityGroup"
        benunits:
          $ref: "#/components/schemas/EntityGroup"
        axes:
          type: array
          description: Optional scan axes. Each axis can vary one variable over a bounded range.
          items:
            $ref: "#/components/schemas/AxisEntry"
      additionalProperties:
        $ref: "#/components/schemas/EntityGroup"
    EntityGroup:
      type: object
      description: Map of entity IDs to entity payloads.
      additionalProperties:
        $ref: "#/components/schemas/Entity"
      example:
        you:
          age:
            "2025": 30
          employment_income:
            "2025": 50000
    Entity:
      type: object
      description: Variables for one entity. The members property links group entities back to people.
      properties:
        members:
          type: array
          items:
            type: string
      additionalProperties:
        $ref: "#/components/schemas/PeriodValueMap"
    PeriodValueMap:
      type: object
      description: Map from a year, month, or other model period to a value.
      additionalProperties:
        $ref: "#/components/schemas/HouseholdValue"
      example:
        "2025": 50000
    HouseholdValue:
      description: A model input or output value for one period.
      nullable: true
      oneOf:
        - type: number
        - type: string
        - type: boolean
        - type: array
          items: {}
        - type: object
          additionalProperties: true
    AxisEntry:
      description: A single axis specification or a crossed list of axis specifications.
      oneOf:
        - $ref: "#/components/schemas/Axis"
        - type: array
          items:
            $ref: "#/components/schemas/Axis"
    Axis:
      type: object
      required:
        - name
        - min
        - max
        - count
      properties:
        name:
          type: string
          description: Variable name to scan.
          example: employment_income
        period:
          type: string
          description: Period to scan.
          example: "2025"
        min:
          type: number
          example: 0
        max:
          type: number
          example: 100000
        count:
          type: integer
          minimum: 1
          maximum: 100
          example: 11
    CalculateSuccessResponse:
      type: object
      required:
        - status
        - message
        - result
        - policyengine_bundle
      properties:
        status:
          type: string
          enum:
            - ok
        message:
          type: string
          nullable: true
        result:
          $ref: "#/components/schemas/CalculationResult"
        policyengine_bundle:
          $ref: "#/components/schemas/PolicyEngineBundle"
        warnings:
          type: array
          description: Non-fatal request warnings, such as deprecated variable inputs or surprising period shapes.
          items:
            type: string
    CalculationResult:
      type: object
      description: Calculated household data, keyed by entity group, entity ID, variable name, and period.
      additionalProperties:
        $ref: "#/components/schemas/EntityGroup"
    PolicyEngineBundle:
      type: object
      required:
        - model_version
      properties:
        model_version:
          type: string
          description: Version of the country model used for the calculation.
        data_version:
          type: string
          nullable: true
          description: Version of the input data used by the country model, when available.
        dataset:
          type: string
          nullable: true
          description: Dataset used by the country model, when available.
      additionalProperties: true
    ApiErrorResponse:
      type: object
      required:
        - status
        - message
      properties:
        status:
          type: string
          enum:
            - error
        message:
          type: string
        errors:
          type: array
          description: Field-level or variable-level validation messages.
          items:
            type: string
    VersionRoutingErrorResponse:
      type: object
      required:
        - status
        - code
        - message
        - requested_version
        - country_id
        - available_versions
      properties:
        status:
          type: string
          enum:
            - error
        code:
          type: string
          enum:
            - unsupported_version
        message:
          type: string
        requested_version:
          type: string
        country_id:
          type: string
        available_versions:
          type: object
          description: Active package versions for the requested country, keyed by release channel.
          additionalProperties:
            type: string
    AuthErrorResponse:
      type: object
      properties:
        error:
          type: string
        error_description:
          type: string
    CalculateAnalyticsResponse:
      type: object
      required:
        - status
        - message
        - start_time
        - end_time
        - requested_version
        - resolved_channel
        - client_id
        - unique
      properties:
        status:
          type: string
          enum:
            - ok
        message:
          type: string
          nullable: true
        start_time:
          type: string
          format: date-time
          nullable: true
        end_time:
          type: string
          format: date-time
          nullable: true
        requested_version:
          type: string
          nullable: true
        resolved_channel:
          type: string
          nullable: true
          enum:
            - current
            - frontier
        client_id:
          type: string
          nullable: true
        unique:
          type: boolean
        requests:
          type: array
          items:
            $ref: "#/components/schemas/CalculateAnalyticsRequestRecord"
        unique_keys:
          type: array
          items:
            $ref: "#/components/schemas/CalculateAnalyticsVariableKeySummary"
    CalculateAnalyticsRequestRecord:
      type: object
      properties:
        request_uuid:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        client_id:
          type: string
          nullable: true
        api_version:
          type: string
          nullable: true
        country_id:
          type: string
          nullable: true
          description: Country identifier, or null when it was not collected for a legacy visit.
        model_version:
          type: string
          nullable: true
        requested_version:
          type: string
          nullable: true
        resolved_channel:
          type: string
          nullable: true
          enum:
            - current
            - frontier
        endpoint:
          type: string
          nullable: true
        method:
          type: string
          enum:
            - DELETE
            - GET
            - HEAD
            - OPTIONS
            - PATCH
            - POST
            - PUT
        response_status_code:
          type: integer
          nullable: true
        distinct_variable_count:
          type: integer
        unsupported_variable_count:
          type: integer
        deprecated_allowlisted_variable_count:
          type: integer
        record_source:
          type: string
          description: Whether the request was recorded by live analytics collection or recovered from the legacy visits table.
          enum:
            - live
            - legacy_visits
        variable_metadata_collected:
          type: boolean
          description: False when variable usage metadata was never collected and therefore cannot be reconstructed.
        variables:
          type: array
          description: Grouped variable metadata. Empty when variable_metadata_collected is false.
          items:
            $ref: "#/components/schemas/CalculateAnalyticsVariableRecord"
    CalculateAnalyticsVariableRecord:
      type: object
      properties:
        variable_name:
          type: string
        entity_type:
          type: string
        source:
          $ref: "#/components/schemas/CalculateAnalyticsVariableSource"
        period_granularity:
          $ref: "#/components/schemas/CalculateAnalyticsPeriodGranularity"
        entity_count:
          type: integer
        period_count:
          type: integer
        occurrence_count:
          type: integer
        availability_status:
          $ref: "#/components/schemas/CalculateAnalyticsAvailabilityStatus"
        variable_name_truncated:
          type: boolean
    CalculateAnalyticsVariableKeySummary:
      type: object
      properties:
        variable_name:
          type: string
        entity_type:
          type: string
        source:
          $ref: "#/components/schemas/CalculateAnalyticsVariableSource"
        period_granularity:
          $ref: "#/components/schemas/CalculateAnalyticsPeriodGranularity"
        availability_status:
          $ref: "#/components/schemas/CalculateAnalyticsAvailabilityStatus"
        variable_name_truncated:
          type: boolean
        request_count:
          type: integer
        occurrence_count:
          type: integer
        first_seen:
          type: string
          format: date-time
        last_seen:
          type: string
          format: date-time
    CalculateAnalyticsResolvedChannel:
      type: string
      enum:
        - current
        - frontier
    CalculateAnalyticsVariableSource:
      type: string
      enum:
        - household_input
        - requested_output
        - mixed
        - axis
    CalculateAnalyticsAvailabilityStatus:
      type: string
      enum:
        - supported
        - deprecated_allowlisted
        - unsupported
    CalculateAnalyticsPeriodGranularity:
      type: string
      enum:
        - year
        - month
        - day
        - mixed
        - none
        - unknown
