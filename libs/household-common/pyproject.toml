[project]
name = "policyengine-household-common"
version = "0.33.0"
description = "Shared kernel for the PolicyEngine Household API services"
readme = "README.md"
authors = [
    { name = "PolicyEngine", email = "hello@policyengine.org" },
]
requires-python = ">=3.12"
# Keep this closure light on purpose: no numpy, no SQLAlchemy, no country
# model packages, no modal. The analytics writer's image depends on it.
# worker_dispatch.py imports modal lazily at call time; modal is deliberately
# a dependency of the service projects that use it, not of this library.
dependencies = [
    "flask>=3.1.3",
    "pydantic",
    "pyyaml>=6",
    "policyengine-observability[flask,google]>=1.4.0,<2",
]

[project.optional-dependencies]
auth = [
    "Authlib>=1.7.1",
    "joserfc>=1.6.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["policyengine_household_common"]
