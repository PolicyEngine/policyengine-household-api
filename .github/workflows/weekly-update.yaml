name: Weekly US Household API Update

on:
  schedule:
    # Every Tuesday at 5 PM EST (10 PM UTC). Moved a day earlier than the
    # Wednesday go-live so the PR and CI land Tuesday: the team can review
    # and merge Tuesday, staging deploy + integration tests validate that
    # evening, and the weekly release then waits at the production-gate
    # approval for a deliberate Wednesday go-live. See issue #1558.
    - cron: "0 22 * * 2"
  # Allow manual trigger
  workflow_dispatch:

jobs:
  update-packages:
    name: Update PolicyEngine Packages
    runs-on: ubuntu-latest
    if: github.repository == 'PolicyEngine/policyengine-household-api'
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          # Pinned for reproducible lockfile updates, at the release that
          # wrote uv.lock. Releases before 0.13.4 trust the compromised
          # eMudhra root "emSign ECC Root CA - G3" through uv's compiled-in
          # CA list (https://emudhra.we-have-a-problem.com).
          version: "0.13.6"

      - name: Install dependencies
        run: |
          pip install requests packaging

      - name: Check for updates and generate summary
        id: check_updates
        run: python .github/scripts/check_updates.py

      - name: Refresh lockfile
        if: steps.check_updates.outputs.has_updates == 'true'
        run: uv lock --upgrade-package policyengine-us

      - name: No updates available
        if: steps.check_updates.outputs.has_updates != 'true'
        run: |
          echo "::notice::No package updates available. policyengine_us is already at the latest version."

      - name: Commit and push changes
        if: steps.check_updates.outputs.has_updates == 'true'
        env:
          UPDATES_SUMMARY: ${{ steps.check_updates.outputs.updates_summary }}
        run: bash .github/scripts/commit-weekly-update.sh

      - name: Create Pull Request
        if: steps.check_updates.outputs.has_updates == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: .github/scripts/create_pr.sh
