name: Pull request

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

env:
  PYTHON_VERSION: "3.12"

concurrency:
  group: household-api-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-modal-release-body:
    name: Check Modal release body
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
      - name: Install dependencies
        run: uv sync --all-packages
      - name: Check Modal release body
        run: uv run python .github/scripts/check_modal_release_body.py

  check-modal-release-alembic:
    name: Check Modal release Alembic compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
      - name: Install dependencies
        run: uv sync --all-packages
      - name: Check Modal release Alembic compatibility
        run: uv run python .github/scripts/check_modal_release_alembic.py

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Ruff
        run: pip install "ruff>=0.9.0"
      - name: Ruff format check
        run: ruff format --check .
  check-changelog:
    name: Check changelog fragment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check changelog fragment exists
        run: bash .github/scripts/check-changelog-fragment.sh
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
      - name: Install dependencies
        run: make install
      - name: Run tests without auth
        run: make test
      - name: Run tests with auth
        run: make test-with-auth
        env:
          # Public fixtures consumed by the test-only static token validator.
          # These are not Auth0 credentials; keep these values public.
          AUTH__ENABLED: "true"
          AUTH0_ADDRESS_NO_DOMAIN: test.invalid
          AUTH0_AUDIENCE_NO_DOMAIN: https://household-api.test.invalid
          AUTH0_TEST_TOKEN_NO_DOMAIN: ci-static-bearer-token
          AUTH0_TEST_TOKEN_SCOPES: read:calculate-analytics

  test-analytics-writer-isolated:
    # Runs the analytics writer's tests in that member's own dependency
    # closure, proving in PR CI that the slim writer environment imports and
    # serves — the failure class of issue #1603 — and that heavy modules
    # (numpy, country packages, modal) stay structurally uninstallable there.
    name: Test analytics writer in isolated closure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
      - name: Sync the analytics-api member closure only
        run: uv sync --package policyengine-household-analytics-api
      - name: Run analytics-api tests in the slim environment
        run: uv run --no-sync pytest -vv --timeout=150 -rP projects/analytics-api/tests
